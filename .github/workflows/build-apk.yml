name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write      # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Routine.apk

      # Download from the run's "Artifacts" section (comes as a .zip)
      - uses: actions/upload-artifact@v4
        with:
          name: Routine-APK
          path: Routine.apk

      # Also publish it as a Release, so your phone can download the .apk directly
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Routine build ${{ github.run_number }}
          files: Routine.apk
