name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write      # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK; just accept its licenses
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Routine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Routine-APK
          path: Routine.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Routine build ${{ github.run_number }}
          files: Routine.apk
